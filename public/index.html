<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wrap {
      width: 100%;
      max-width: 760px;
    }
    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-weight: 400;
      font-size: 42px;
      letter-spacing: 1px;
    }
    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .prompt {
      background: #f6f6f6;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 14px 16px;
      text-align: left;
      color: #111;
      cursor: pointer;
      font-size: 14px;
      transition: .2s ease;
    }
    .prompt:hover {
      background: #f0f0f0;
      border-color: #d7d7d7;
    }
    .row {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      border: 1px solid #d9d9d9;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #111;
    }
    button {
      border: none;
      background: #111;
      color: white;
      border-radius: 10px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #222;
    }
    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #555;
      display: none;
    }
    .status.show {
      display: block;
    }
    .answer {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #ececec;
      background: #fafafa;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      display: none;
    }
    .answer.show {
      display: block;
    }
    @media (max-width: 560px) {
      .prompt-grid {
        grid-template-columns: 1fr;
      }
      .row {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>2</h1>

    <div class="prompt-grid">
      <button class="prompt" data-text="What is the capital of France?">What is the capital of France?</button>
      <button class="prompt" data-text="How does photosynthesis work?">How does photosynthesis work?</button>
      <button class="prompt" data-text="What causes the seasons?">What causes the seasons?</button>
      <button class="prompt" data-text="What is a black hole?">What is a black hole?</button>
    </div>

    <div class="row">
      <input id="question" type="text" placeholder="Ask anything..." />
      <button id="send">Send</button>
    </div>

    <div id="status" class="status">Loading model...</div>
    <div id="answer" class="answer"></div>
  </div>

  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.0';

    const input = document.getElementById('question');
    const sendBtn = document.getElementById('send');
    const answerBox = document.getElementById('answer');
    const statusBox = document.getElementById('status');

    let generator = null;

    async function ensureModel() {
      if (generator) return generator;
      statusBox.textContent = 'Loading model...';
      statusBox.classList.add('show');
      generator = await pipeline('text-generation', 'Xenova/distilgpt2');
      statusBox.textContent = 'Ready.';
      return generator;
    }

    async function askQuestion() {
      const text = input.value.trim();
      if (!text) return;

      answerBox.textContent = '';
      answerBox.classList.remove('show');
      statusBox.textContent = 'Thinking...';
      statusBox.classList.add('show');

      try {
        const model = await ensureModel();
        const result = await model(text, {
          max_new_tokens: 60,
          temperature: 0.8,
          do_sample: true,
          top_p: 0.95
        });

        const output = result?.[0]?.generated_text || 'No answer generated.';
        const cleaned = output.replace(text, '').trim();

        answerBox.textContent = cleaned || 'No answer generated.';
        answerBox.classList.add('show');
      } catch (error) {
        answerBox.textContent = 'Model failed to load or generate an answer. Try again in a moment.';
        answerBox.classList.add('show');
        console.error(error);
      } finally {
        statusBox.textContent = 'Ready.';
      }
    }

    document.querySelectorAll('.prompt').forEach((btn) => {
      btn.addEventListener('click', () => {
        input.value = btn.dataset.text;
        input.focus();
      });
    });

    sendBtn.addEventListener('click', askQuestion);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') askQuestion();
    });

    statusBox.textContent = 'Ready to answer.';
    statusBox.classList.add('show');
  </script>
</body>
</html>
