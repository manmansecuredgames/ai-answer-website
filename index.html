<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 400;
            color: #000;
            margin-bottom: 8px;
        }

        .prompts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 30px;
        }

        .prompt-btn {
            padding: 16px;
            background: #f5f5f5;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            transition: all 0.2s;
            text-align: left;
            line-height: 1.4;
        }

        .prompt-btn:hover {
            background: #efefef;
            border-color: #d0d0d0;
        }

        .input-section {
            display: flex;
            gap: 8px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .input-section input:focus {
            outline: none;
            border-color: #000;
        }

        .input-section button {
            padding: 12px 24px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .input-section button:hover {
            background: #333;
        }

        .results {
            margin-top: 30px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-item {
            margin-bottom: 20px;
            padding: 16px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 3px solid #000;
        }

        .result-question {
            font-weight: 600;
            margin-bottom: 10px;
            color: #000;
        }

        .result-answer {
            color: #555;
            line-height: 1.6;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #000;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>2</h1>
        </div>

        <div class="prompts">
            <button class="prompt-btn" onclick="setPrompt('What is the capital of France?')">What is the capital of France?</button>
            <button class="prompt-btn" onclick="setPrompt('How does photosynthesis work?')">How does photosynthesis work?</button>
            <button class="prompt-btn" onclick="setPrompt('What is the meaning of life?')">What is the meaning of life?</button>
            <button class="prompt-btn" onclick="setPrompt('Tell me about quantum physics')">Tell me about quantum physics</button>
        </div>

        <div class="input-section">
            <input type="text" id="userInput" placeholder="Ask a question..." onkeypress="handleKeyPress(event)">
            <button onclick="askQuestion()">Send</button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        const API_KEY = 'sk-proj-qJ7w_mTb1a7ZpQ9kL2mN3oP4qR5sT6uV7wX8yZ9aB0cD1eF2gH3iJ4kL5mN6o'; // Replace with your OpenAI key

        function setPrompt(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('userInput').focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                askQuestion();
            }
        }

        async function askQuestion() {
            const input = document.getElementById('userInput').value.trim();
            if (!input) return;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading"><span class="spinner"></span>Loading...</div>';
            resultsDiv.classList.add('show');

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4',
                        messages: [
                            {
                                role: 'user',
                                content: input
                            }
                        ],
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to get response');
                }

                const data = await response.json();
                const answer = data.choices[0].message.content;

                resultsDiv.innerHTML = `
                    <div class="result-item">
                        <div class="result-question">${escapeHtml(input)}</div>
                        <div class="result-answer">${escapeHtml(answer)}</div>
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="result-item">
                        <div class="result-answer" style="color: #d32f2f;">Error: ${error.message}</div>
                    </div>
                `;
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
